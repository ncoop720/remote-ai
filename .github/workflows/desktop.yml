# Builds the desktop app on each OS. A tag like v2.0.0 (matching "version" in package.json)
# uploads the installers to a draft GitHub release; publish it on GitHub to make it available.
# Running the workflow by hand builds the installers as downloadable artifacts only.
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft release for all three builds to upload into (each creating its own would race).
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --title "remote-ai ${GITHUB_REF_NAME#v}" --notes "Installers for macOS, Windows and Linux."

  build:
    needs: release
    if: always() && needs.release.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: mac-x64,mac-arm64
            builder: --mac --x64 --arm64
          - os: windows-latest
            targets: win-x64
            builder: --win --x64
          - os: ubuntu-latest
            targets: linux-x64
            builder: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: tailscale/go.mod
          cache-dependency-path: tailscale/go.sum
      - run: npm ci
      # The tests assume POSIX paths in places; one run covers them.
      - if: runner.os == 'Linux'
        run: npm test
      - run: node scripts/build-desktop.mjs --targets ${{ matrix.targets }}
      - run: npx electron-builder ${{ matrix.builder }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: remote-ai-${{ matrix.os }}
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/*.exe
            dist/release/*.AppImage
            dist/release/*.deb
          if-no-files-found: error
